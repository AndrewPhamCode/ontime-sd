[project]
name = "ontime-sd"
version = "0.1.0"
description = "Real-time San Diego MTS arrival predictions that beat the official ETAs"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "asyncpg>=0.30",
    "gtfs-realtime-bindings>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
ontime-collector = "ontime_sd.collector:main"
ontime-mock = "ontime_sd.mock.server:main"
ontime-migrate = "ontime_sd.db:migrate_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ontime_sd"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Fail loudly instead of hanging if a test waits on a feed or the database.
timeout = 60
filterwarnings = ["error::DeprecationWarning"]
